version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: music_composer_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: music_composer_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=ai_music_db
      - JWT_SECRET_KEY=super_secret_jwt_key_music_composer
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: music_composer_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
